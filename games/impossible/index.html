  }
  reset(true);
  function pressJump() {
    jumpBuf = JUMP_BUFFER;
  }
  function floorAt(x) {
    let top = -Infinity, inGap = false;
    for (const [t, ox, ow, oh] of LEVEL) {
      if (x < ox || x > ox + ow) continue;
      if (t === "gap") inGap = true;
      if (t === "block") top = Math.max(top, GROUND_Y - (oh ?? 0));
    }
    if (top > -Infinity) return top;
    return inGap ? -Infinity : GROUND_Y;
  }
  function solidSideAt(x, y) {
    for (const [t, ox, ow, oh] of LEVEL) {
      if (t !== "block") continue;
      const top = GROUND_Y - (oh ?? 0);
      if (x > ox && x < ox + ow && y + CUBE > top + 2 && y < GROUND_Y) return true;
    }
    return false;
  }
  function spikeAt(x, y) {
    for (const [t, ox, ow] of LEVEL) {
      if (t !== "spike") continue;
      const cx = x + CUBE / 2, cy = y + CUBE;
      if (cx > ox + 4 && cx < ox + ow - 4 && cy > GROUND_Y - 26) return true;
    }
    return false;
  }
  function die() {
    const prog = cube.x / LEVEL_END;
    if (prog > best) best = prog;
    save("impossible", "best-progress", best);
    state = "dead";
    deadT = 0;
    deaths++;
    sfx.preset("death");
    for (let i = 0; i < 26; i++) particles.push({
      x: cube.x + CUBE / 2,
      y: cube.y + CUBE / 2,
      vx: (Math.random() - 0.5) * 700,
      vy: -Math.random() * 600 - 100,
      s: 4 + Math.random() * 8,
      life: 0.5 + Math.random() * 0.4
    });
  }
  function step(dt) {
    if (state === "dead") {
      deadT += dt * 1e3;
      if (deadT >= RESPAWN_MS) reset(false);
      return;
    }
    if (state === "clear") {
      clearT += dt;
      return;
    }
    if (paused) return;
    cube.x += SPEED * dt;
    const footX = cube.x + CUBE / 2;
    const floor = floorAt(footX);
    if (cube.grounded) {
      if (floor === -Infinity || cube.y + CUBE < floor - 1) {
        cube.grounded = false;
        coyoteT = COYOTE;
      }
    } else {
      coyoteT = Math.max(0, coyoteT - dt);
      cube.vy += GRAV * dt;
      cube.y += cube.vy * dt;
      if (floor > -Infinity && cube.vy >= 0 && cube.y + CUBE >= floor) {
        cube.y = floor - CUBE;
        cube.vy = 0;
        cube.grounded = true;
        cube.rot = Math.round(cube.rot / (Math.PI / 2)) * (Math.PI / 2);
      }
    }
    if (!cube.grounded) cube.rot += dt * 4.2;
    jumpBuf = Math.max(0, jumpBuf - dt);
    if (jumpBuf > 0 && (cube.grounded || coyoteT > 0)) {
      cube.vy = -JUMP_V;
      cube.grounded = false;
      coyoteT = 0;
      jumpBuf = 0;
      sfx.blip({ wave: "square", freq: 520, freqEnd: 700, duration: 0.05, volume: 0.4 });
    }
    if (spikeAt(cube.x, cube.y) || solidSideAt(cube.x + CUBE, cube.y)) return die();
    if (floor === -Infinity && cube.y + CUBE > GROUND_Y + 8) return die();
    if (cube.x >= LEVEL_END) {
      state = "clear";
      clearT = 0;
      sfx.preset("pickup");
      if (1 > best) {
        best = 1;
        save("impossible", "best-progress", best);
      }
    }
    const prog = cube.x / LEVEL_END;
    if (prog > best) best = prog;
  }
  function pollInput() {
    if (input.wasPressed("fire") || input.wasPressed("up")) pressJump();
    if (input.pointer.active && !prevPointerActive) pressJump();
    prevPointerActive = input.pointer.active;
    if (input.wasPressed("action")) reset(false);
    if (input.wasPressed("pause")) paused = !paused;
    input.endFrame();
  }
  input.setKeymaps({ p1: { KeyZ: "fire", KeyR: "action" } });
  var acc = 0;
  var last = performance.now();
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1e3);
    last = now;
    pollInput();
    while (acc >= DT) {
      step(DT);
      acc -= DT;
    }
    for (const p of particles) {
      p.x += p.vx * DT;
      p.y += p.vy * DT;
      p.vy += GRAV * DT * 0.6;
      p.life -= DT;
    }
    particles = particles.filter((p) => p.life > 0);
    camX = cube.x - 220;
    draw();
    requestAnimationFrame(frame);
  }
  function draw() {
    ctx.fillStyle = "#e8e8e8";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(-camX, 0);
    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(camX - 50, GROUND_Y, W + 100, H - GROUND_Y);
    ctx.fillStyle = "#e8e8e8";
    for (const [t, gx, gw] of LEVEL) if (t === "gap") ctx.fillRect(gx, GROUND_Y, gw, H - GROUND_Y);
    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 3;
    for (const [t, gx, gw] of LEVEL) if (t === "gap") ctx.strokeRect(gx, GROUND_Y, gw, 4);
    for (const [t, ox, ow, oh] of LEVEL) {
      if (t === "spike") {
        ctx.fillStyle = "#2b2b2b";
        ctx.beginPath();
        ctx.moveTo(ox, GROUND_Y);
        ctx.lineTo(ox + ow / 2, GROUND_Y - 34);
        ctx.lineTo(ox + ow, GROUND_Y);
        ctx.fill();
      } else if (t === "block") {
        ctx.fillStyle = "#4a6fa5";
        ctx.fillRect(ox, GROUND_Y - (oh ?? 0), ow, oh ?? 0);
        ctx.strokeStyle = "#2b2b2b";
        ctx.strokeRect(ox, GROUND_Y - (oh ?? 0), ow, oh ?? 0);
      }
    }
    ctx.fillStyle = "#2b8a3e";
    ctx.fillRect(LEVEL_END, GROUND_Y - 160, 8, 160);
    ctx.fillStyle = "#d6336c";
    for (const p of particles) ctx.fillRect(p.x, p.y, p.s, p.s);
    if (state !== "dead") {
      ctx.save();
      ctx.translate(cube.x + CUBE / 2, cube.y + CUBE / 2);
      ctx.rotate(cube.rot);
      ctx.fillStyle = "#f08c00";
      ctx.fillRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
      ctx.strokeStyle = "#2b2b2b";
      ctx.lineWidth = 3;
      ctx.strokeRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle = "#2b2b2b";
    ctx.font = "16px monospace";
    const prog = Math.min(100, Math.max(0, cube.x / LEVEL_END * 100));
    ctx.fillText(`ATTEMPT ${attempt}   DEATHS ${deaths}   ${prog.toFixed(0)}%   BEST ${(best * 100).toFixed(0)}%`, 16, 26);
    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(16, 36, 300, 8);
    ctx.fillStyle = "#f08c00";
    ctx.fillRect(16, 36, 300 * prog / 100, 8);
    ctx.fillStyle = "#666";
    ctx.font = "13px monospace";
    ctx.fillText("SPACE/UP/Z/CLICK jump \xB7 R restart \xB7 ESC pause \u2014 INTERNAL replica", 16, H - 14);
    if (paused) banner("PAUSED");
    if (state === "dead") banner("DEAD \u2014 respawning\u2026");
    if (state === "clear") banner("LEVEL CLEAR \u2014 press R to run again");
  }
  function banner(t) {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, H / 2 - 44, W, 88);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 30px monospace";
    ctx.textAlign = "center";
    ctx.fillText(t, W / 2, H / 2 + 10);
    ctx.textAlign = "left";
  }
  requestAnimationFrame(frame);
  if (new URLSearchParams(location.search).has("debug")) {
    window.__maga = {
      get state() {
        return state;
      },
      get x() {
        return cube.x;
      },
      get y() {
        return cube.y;
      },
      get attempt() {
        return attempt;
      },
      get deaths() {
        return deaths;
      },
      get progress() {
        return cube.x / LEVEL_END;
      },
      jump: pressJump,
      reset: () => reset(false),
      teleport(x) {
        cube.x = x;
      },
      die,
      LEVEL_END
    };
    Object.defineProperty(window, "__proto", {
      value: {
        get state() {
          return state;
        },
        get x() {
          return cube.x;
        },
        get y() {
          return cube.y;
        },
        get attempt() {
          return attempt;
        },
        get deaths() {
          return deaths;
        },
        get grounded() {
          return cube.grounded;
        },
        get progress() {
          return cube.x / LEVEL_END;
        },
        get camX() {
          return camX;
        },
        get paused() {
          return paused;
        },
        get best() {
          return best;
        },
        get LEVEL() {
          return LEVEL;
        },
        get LEVEL_END() {
          return LEVEL_END;
        }
      },
      configurable: true,
      enumerable: true,
      writable: false
    });
  }
})();

</script>
