        const s = 0.7 + i * 31 % 10 / 14;
        ctx.globalAlpha = 0.16 + 0.1 * (i % 3 / 3);
        const x = (px + W + 400) % (W + 400) - 200;
        ctx.beginPath();
        ctx.ellipse(x, py, 90 * s, 26 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 60 * s, py + 8 * s, 60 * s, 20 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (deco === "phase") {
      ctx.globalAlpha = 0.1 + 0.08 * pulse;
      ctx.fillStyle = deco;
      const off = (camX * 0.22 + t * 30) % 280;
      for (let x = -280 - off; x < W + 280; x += 280) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 90, 0);
        ctx.lineTo(x + 90 - 120, GROUND_Y);
        ctx.lineTo(x - 120, GROUND_Y);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  function flag(x, lit, pal, kind) {
    ctx.strokeStyle = pal.groundEdge;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x, GROUND_Y - 58);
    ctx.stroke();
    ctx.fillStyle = lit ? pal.accent : "rgba(128,128,128,.45)";
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y - 58);
    ctx.lineTo(x + 26, GROUND_Y - 49);
    ctx.lineTo(x, GROUND_Y - 40);
    ctx.fill();
    if (kind === "drop") {
      ctx.fillStyle = pal.accent;
      ctx.fillRect(x - 5, GROUND_Y - 66, 10, 8);
    }
  }
  function drawRun() {
    const lv = level();
    const pal = lv.palette;
    bg(pal, lv.deco, runT);
    ctx.save();
    ctx.translate(-camX, 0);
    ctx.fillStyle = pal.ground;
    ctx.fillRect(camX - 50, GROUND_Y, W + 100, H - GROUND_Y);
    ctx.fillStyle = "rgba(0,0,0,.28)";
    for (const o of lv.obstacles) if (o.t === "gap") ctx.fillRect(o.x, GROUND_Y, o.w, H - GROUND_Y);
    ctx.strokeStyle = pal.groundEdge;
    ctx.lineWidth = 3;
    for (const o of lv.obstacles) if (o.t === "gap") ctx.strokeRect(o.x, GROUND_Y, o.w, 4);
    for (const o of lv.obstacles) {
      if (o.t === "spike") {
        ctx.fillStyle = pal.spike;
        ctx.beginPath();
        ctx.moveTo(o.x, GROUND_Y);
        ctx.lineTo(o.x + o.w / 2, GROUND_Y - 34);
        ctx.lineTo(o.x + o.w, GROUND_Y);
        ctx.fill();
        ctx.strokeStyle = pal.spikeEdge;
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (o.t === "block") {
        ctx.fillStyle = pal.block;
        ctx.fillRect(o.x, GROUND_Y - (o.h ?? 0), o.w, o.h ?? 0);
        ctx.strokeStyle = pal.blockEdge;
        ctx.lineWidth = 3;
        ctx.strokeRect(o.x, GROUND_Y - (o.h ?? 0), o.w, o.h ?? 0);
      }
    }
    ctx.fillStyle = pal.groundEdge;
    ctx.fillRect(lv.end, GROUND_Y - 170, 8, 170);
    ctx.fillStyle = pal.accent;
    ctx.fillRect(lv.end + 8, GROUND_Y - 170, 44, 26);
    ctx.fillRect(lv.end + 8, GROUND_Y - 126, 30, 12);
    if (mode === "practice") {
      for (const c of lv.checkpoints) if (Math.abs(c - camX) < W + 200) flag(c, c <= cube.x, pal, "auto");
      if (droppedCp !== null) flag(droppedCp, true, pal, "drop");
    }
    ctx.fillStyle = pal.accent;
    for (const p of particles) ctx.fillRect(p.x, p.y, p.s, p.s);
    if (state !== "dead") {
      ctx.save();
      ctx.translate(cube.x + CUBE / 2, cube.y + CUBE / 2);
      ctx.rotate(cube.rot);
      ctx.fillStyle = pal.cube;
      ctx.fillRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
      ctx.strokeStyle = pal.cubeEdge;
      ctx.lineWidth = 3;
      ctx.strokeRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
      ctx.restore();
    }
    ctx.restore();
    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,64,48,${(flashT * 0.32).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
    const prog = clamp01(cube.x / lv.end) * 100;
    ctx.fillStyle = pal.ink;
    ctx.font = "bold 15px monospace";
    ctx.textAlign = "left";
    ctx.fillText(`ATTEMPT ${attempt}`, 16, 28);
    ctx.font = "13px monospace";
    ctx.fillText(`DEATHS ${deaths}   BEST ${(bests[levelIdx] * 100).toFixed(0)}%${mode === "practice" ? "   PRACTICE" : ""}`, 16, 48);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(W / 2 - 220, 18, 440, 12);
    ctx.fillStyle = pal.accent;
    ctx.fillRect(W / 2 - 220, 18, 440 * prog / 100, 12);
    ctx.fillStyle = pal.ink;
    ctx.font = "bold 13px monospace";
    ctx.textAlign = "right";
    ctx.fillText(`${prog.toFixed(0)}%`, W - 16, 28);
    ctx.textAlign = "left";
    ctx.font = "12px monospace";
    ctx.fillStyle = pal.ink;
    ctx.globalAlpha = 0.75;
    ctx.fillText("SPACE/TAP jump \xB7 R restart \xB7 ESC pause", 16, H - 14);
    ctx.globalAlpha = 1;
    if (mode === "practice" && !paused && state === "running") {
      const b = { x: W - 150, y: H - 74, w: 130, h: 46 };
      ctx.fillStyle = droppedCp !== null ? pal.accent : "rgba(0,0,0,.4)";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = pal.groundEdge;
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = droppedCp !== null ? "#111" : pal.ink;
      ctx.font = "bold 15px monospace";
      ctx.textAlign = "center";
      ctx.fillText(droppedCp !== null ? "FLAG ON" : "DROP FLAG", b.x + b.w / 2, b.y + 29);
      ctx.textAlign = "left";
      uiButtons.push({ ...b, id: "flag" });
    }
    if (state === "dead") banner("CRASHED");
    if (paused) drawPause(pal);
  }
  function banner(t) {
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(0, H / 2 - 40, W, 80);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 28px monospace";
    ctx.textAlign = "center";
    ctx.fillText(t, W / 2, H / 2 + 10);
    ctx.textAlign = "left";
  }
  function menuButton(x, y, w, h, label, id, selected, ink, accent) {
    ctx.fillStyle = selected ? accent : "rgba(255,255,255,.07)";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = selected ? accent : "rgba(255,255,255,.25)";
    ctx.lineWidth = selected ? 3 : 1;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = selected ? "#0e0d12" : ink;
    ctx.font = "bold 19px monospace";
    ctx.textAlign = "center";
    ctx.fillText(label, x + w / 2, y + h / 2 + 7);
    ctx.textAlign = "left";
    uiButtons.push({ x, y, w, h, id });
  }
  function volumeRow(y, ink, accent) {
    ctx.fillStyle = ink;
    ctx.font = "15px monospace";
    ctx.textAlign = "center";
    ctx.fillText(`VOLUME  [ ] /  \xB7  M \u2014 MUTE ${muted ? "OFF" : "ON"}`, W / 2, y);
    const bw = 300, bx = W / 2 - bw / 2;
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(bx, y + 12, bw, 12);
    ctx.fillStyle = accent;
    ctx.fillRect(bx, y + 12, bw * vol, 12);
    uiButtons.push({ x: bx - 40, y: y + 4, w: 34, h: 28, id: "vol-down" });
    uiButtons.push({ x: bx + bw + 6, y: y + 4, w: 34, h: 28, id: "vol-up" });
    ctx.font = "bold 17px monospace";
    ctx.fillText("\u2212", bx - 23, y + 24);
    ctx.fillText("+", bx + bw + 23, y + 24);
    ctx.textAlign = "left";
  }
  function drawTitle() {
    ctx.fillStyle = "#0d0b10";
    ctx.fillRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(255,128,64,.16)");
    grad.addColorStop(1, "rgba(64,128,255,.1)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f5efe6";
    ctx.font = "bold 84px monospace";
    ctx.fillText("IMPOSSIBLE", W / 2, 200);
    ctx.fillStyle = "#ff9455";
    ctx.fillText("RUN", W / 2, 290);
    ctx.fillStyle = "#9a94a8";
    ctx.font = "15px monospace";
    ctx.fillText("5 TRACKS \xB7 ONE BUTTON \xB7 RHYTHM OR DEATH", W / 2, 336);
    const blink = 0.55 + 0.45 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = blink;
    ctx.fillStyle = "#f5efe6";
    ctx.font = "bold 22px monospace";
    ctx.fillText("PRESS SPACE OR TAP TO START", W / 2, 420);
    ctx.globalAlpha = 1;
    volumeRow(480, "#9a94a8", "#ff9455");
    ctx.textAlign = "left";
  }
  function drawSelect() {
    ctx.fillStyle = "#0d0b10";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f5efe6";
    ctx.font = "bold 30px monospace";
    ctx.fillText("SELECT TRACK", W / 2, 58);
    ctx.font = "13px monospace";
    ctx.fillStyle = "#9a94a8";
    ctx.fillText("ARROWS choose \xB7 SPACE start \xB7 ESC back", W / 2, 84);
    ctx.textAlign = "left";
    LEVELS.forEach((lv, i) => {
      const y = 110 + i * 78;
      const open = unlocked(i);
      const selected = sel === i;
      const chip = ctx.createLinearGradient(60, y, 60, y + 62);
      chip.addColorStop(0, lv.palette.skyTop);
      chip.addColorStop(1, lv.palette.skyBot);
      ctx.fillStyle = chip;
      ctx.fillRect(60, y, 26, 62);
      ctx.strokeStyle = selected ? lv.palette.accent : "rgba(255,255,255,.2)";
      ctx.lineWidth = selected ? 3 : 1;
      ctx.strokeRect(60, y, 836, 62);
      ctx.fillStyle = open ? selected ? "#0e0d12" : "#f5efe6" : "#6d6879";
      if (selected) {
        ctx.fillStyle = lv.palette.accent;
        ctx.globalAlpha = 0.16;
        ctx.fillRect(60, y, 836, 62);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = open ? "#f5efe6" : "#6d6879";
      ctx.font = "bold 21px monospace";
      ctx.fillText(`${i + 1} \xB7 ${open ? lv.name : "LOCKED"}`, 104, y + 27);
      ctx.font = "14px monospace";
      const medalTxt = medals[i] === "perfect" ? "PERFECT" : medals[i] === "cleared" ? "CLEARED" : "\u2014";
      ctx.fillStyle = medals[i] === "perfect" ? "#ffd23f" : medals[i] === "cleared" ? "#c9d3e0" : "#6d6879";
      ctx.fillText(`${medalTxt}`, 104, y + 50);
      ctx.fillStyle = open ? "#9a94a8" : "#6d6879";
      ctx.textAlign = "right";
      ctx.fillText(`${lv.bpm} BPM \xB7 ${(lv.end / SPEED / 60).toFixed(1)} MIN`, 780, y + 27);
      ctx.fillText(`BEST ${(bests[i] * 100).toFixed(0)}%`, 780, y + 50);
      ctx.textAlign = "left";
      uiButtons.push({ x: 60, y, w: 836, h: 62, id: `lv-${i}` });
    });
    volumeRow(528, "#9a94a8", "#ff9455");
  }
  function drawMode() {
    const lv = LEVELS[sel];
    ctx.fillStyle = "#0d0b10";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = lv.palette.accent;
    ctx.font = "bold 34px monospace";
    ctx.fillText(lv.name, W / 2, 140);
    ctx.fillStyle = "#9a94a8";
    ctx.font = "14px monospace";
    ctx.fillText(`${lv.bpm} BPM \xB7 ${(lv.end / SPEED / 60).toFixed(1)} MIN \xB7 BEST ${(bests[sel] * 100).toFixed(0)}%`, W / 2, 172);
    menuButton(W / 2 - 200, 240, 400, 62, "NORMAL RUN", "mode-normal", sel === 0, "#f5efe6", lv.palette.accent);
    ctx.fillStyle = "#9a94a8";
    ctx.font = "13px monospace";
    ctx.fillText("die = back to the start \xB7 CLEARED / PERFECT medals unlock the next track", W / 2, 330);
    menuButton(W / 2 - 200, 360, 400, 62, "PRACTICE", "mode-practice", sel === 1, "#f5efe6", lv.palette.accent);
    ctx.fillStyle = "#9a94a8";
    ctx.font = "13px monospace";
    ctx.fillText("checkpoint flags every ~15% \xB7 C or DROP FLAG plants a movable flag \xB7 no medals", W / 2, 450);
    ctx.fillStyle = "#6d6879";
    ctx.font = "13px monospace";
    ctx.fillText("ESC back", W / 2, 500);
    ctx.textAlign = "left";
  }
  function drawPause(pal) {
    ctx.fillStyle = "rgba(6,5,9,.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = pal.ink;
    ctx.font = "bold 36px monospace";
    ctx.fillText("PAUSED", W / 2, 130);
    const items = ["RESUME", "RESTART TRACK", "EXIT TO TRACKS"];
    items.forEach((label, i) => menuButton(W / 2 - 170, 180 + i * 70, 340, 54, label, ["resume", "restart", "exit"][i], sel === i, "#f5efe6", pal.accent));
    volumeRow(430, "#f5efe6", pal.accent);
    ctx.textAlign = "left";
  }
  function drawClear() {
    const lv = level();
    const pal = lv.palette;
    ctx.fillStyle = "#0d0b10";
    ctx.fillRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, pal.skyTop);
    grad.addColorStop(1, "#0d0b10");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f5efe6";
    ctx.font = "bold 44px monospace";
    ctx.fillText(clearStats.practice ? "PRACTICE CLEAR" : "TRACK CLEAR", W / 2, 150);
    if (!clearStats.practice) {
      const perfect = clearStats.medal === "perfect";
      ctx.fillStyle = perfect ? "#ffd23f" : "#c9d3e0";
      ctx.font = "bold 26px monospace";
      ctx.fillText(perfect ? "\u2605 PERFECT \u2014 5 DEATHS OR FEWER" : "\u2605 CLEARED", W / 2, 205);
    } else {
      ctx.fillStyle = "#9a94a8";
      ctx.font = "15px monospace";
      ctx.fillText("practice runs award no medals \u2014 clear it in NORMAL", W / 2, 205);
    }
    ctx.fillStyle = "#f5efe6";
    ctx.font = "16px monospace";
    ctx.fillText(`${lv.name} \xB7 ${attempt} ATTEMPT${attempt === 1 ? "" : "S"} \xB7 ${deaths} DEATH${deaths === 1 ? "" : "S"}`, W / 2, 260);
    const items = clearStats.next ? ["NEXT TRACK", "RUN AGAIN", "TRACKS"] : ["RUN AGAIN", "TRACKS"];
    items.forEach((label, i) => menuButton(W / 2 - 170, 310 + i * 66, 340, 52, label, clearStats.next ? ["next", "retry", "tracks"][i] : ["retry", "tracks"][i], sel === i, "#f5efe6", pal.accent));
    ctx.textAlign = "left";
  }
  function draw() {
    uiButtons = [];
    switch (screen) {
      case "title":
        drawTitle();
        break;
      case "select":
        drawSelect();
        break;
      case "mode":
        drawMode();
        break;
      case "run":
        drawRun();
        break;
      case "clear":
        drawClear();
        break;
    }
  }
  var acc = 0;
  var last = performance.now();
  function frame(now) {
    const elapsed = Math.min(0.1, (now - last) / 1e3);
    acc += elapsed;
    last = now;
    uiTick();
    while (acc >= DT) {
      if (screen === "run") step(DT);
      acc -= DT;
    }
    flashT = Math.max(0, flashT - elapsed * 3);
    for (const p of particles) {
      p.x += p.vx * DT;
      p.y += p.vy * DT;
      p.vy += GRAV * DT * 0.6;
      p.life -= DT;
    }
    particles = particles.filter((p) => p.life > 0);
    camX = Math.max(0, cube.x - 220);
    draw();
    requestAnimationFrame(frame);
  }
  loadWorld(0);
  requestAnimationFrame(frame);
  if (new URLSearchParams(location.search).has("debug")) {
    window.__maga = {
      get screen() {
        return screen;
      },
      get state() {
        return state;
      },
      get level() {
        return levelIdx;
      },
      get levelName() {
        return level().name;
      },
      get mode() {
        return mode;
      },
      get x() {
        return cube.x;
      },
      get y() {
        return cube.y;
      },
      get vy() {
        return cube.vy;
      },
      get grounded() {
        return cube.grounded;
      },
      get attempt() {
        return attempt;
      },
      get deaths() {
        return deaths;
      },
      get paused() {
        return paused;
      },
      get progress() {
        return clamp01(cube.x / level().end);
      },
      get best() {
        return bests[levelIdx];
      },
      get bests() {
        return [...bests];
      },
      get medals() {
        return [...medals];
      },
      get unlocked() {
        return LEVELS.map((_, i) => unlocked(i));
      },
      get checkpoints() {
        return [...level().checkpoints];
      },
      get passedCheckpoint() {
        return passedCp;
      },
      get droppedCheckpoint() {
        return droppedCp;
      },
      get respawnX() {
        return respawnX;
      },
      get pendingJump() {
        return pendingJump;
      },
      get runT() {
        return runT;
      },
      get levelEnd() {
        return level().end;
      },
      get volume() {
        return vol;
      },
      get muted() {
        return muted;
      },
      jump: pressJump,
      die,
      teleport(x) {
        cube.x = x;
        cube.y = GROUND_Y - CUBE;
        cube.vy = 0;
        cube.grounded = true;
      },
      restart: () => startLevel(levelIdx, mode),
      startLevel,
      toTitle() {
        screen = "title";
        sfx.stopMusic();
      },
      setVolume,
      toggleMute,
      dropFlag
    };
  }
})();

</script>
