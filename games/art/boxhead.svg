<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 704" width="1408" height="704">
  <!-- Boxhead key art — hand-authored SVG (maga-docs r10). Top-down night street:
       lone shotgun hero vs zombie horde. Palette: purple-black sky, asphalt,
       zombie green, muzzle-flash amber. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#2a1f3d"/><stop offset="100%" stop-color="#0d0a14"/>
    </radialGradient>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/><stop offset="60%" stop-color="#ffb020"/><stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <g id="zombie">
      <circle r="14" fill="#4a7a3a" stroke="#2c4a22" stroke-width="3"/>
      <circle cx="-5" cy="-3" r="2.4" fill="#d8e8b0"/><circle cx="5" cy="-3" r="2.4" fill="#d8e8b0"/>
      <path d="M-6 6 Q0 10 6 6" stroke="#2c4a22" stroke-width="2" fill="none"/>
      <path d="M-14 2 L-24 10 M14 2 L24 10" stroke="#4a7a3a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="crate"><rect x="-18" y="-18" width="36" height="36" fill="#7a5a34" stroke="#4a3418" stroke-width="3"/><path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#4a3418" stroke-width="3"/></g>
    <g id="barrel"><ellipse rx="13" ry="16" fill="#5a6a72" stroke="#333f45" stroke-width="3"/><ellipse cy="-8" rx="13" ry="4" fill="#6e8089" stroke="#333f45" stroke-width="2"/></g>
  </defs>
  <rect width="1408" height="704" fill="url(#sky)"/>
  <rect y="430" width="1408" height="274" fill="#1c1a22"/>
  <g opacity=".55" fill="#141118">
    <rect x="60" y="120" width="220" height="330"/><rect x="1140" y="90" width="210" height="360"/>
    <rect x="330" y="60" width="140" height="200"/><rect x="950" y="40" width="150" height="230"/>
  </g>
  <g fill="#0f0d13"><rect x="80" y="140" width="26" height="34"/><rect x="140" y="140" width="26" height="34"/><rect x="200" y="140" width="26" height="34"/><rect x="1160" y="120" width="26" height="34"/><rect x="1220" y="120" width="26" height="34"/><rect x="1280" y="120" width="26" height="34"/></g>
  <!-- crosswalk -->
  <g fill="#3a3742" opacity=".8"><rect x="560" y="470" width="40" height="14"/><rect x="620" y="470" width="40" height="14"/><rect x="680" y="470" width="40" height="14"/><rect x="740" y="470" width="40" height="14"/><rect x="800" y="470" width="40" height="14"/></g>
  <!-- blood splatters -->
  <g fill="#5e1010" opacity=".85">
    <ellipse cx="620" cy="560" rx="26" ry="10"/><ellipse cx="660" cy="575" rx="10" ry="5"/><circle cx="640" cy="548" r="5"/>
    <ellipse cx="830" cy="600" rx="30" ry="12"/><circle cx="870" cy="585" r="6"/><ellipse cx="800" cy="620" rx="12" ry="6"/>
    <ellipse cx="480" cy="640" rx="20" ry="8"/><circle cx="510" cy="628" r="4"/>
  </g>
  <!-- props -->
  <use href="#crate" x="150" y="560"/><use href="#crate" x="190" y="600"/><use href="#barrel" x="120" y="620"/>
  <use href="#crate" x="1260" y="540"/><use href="#barrel" x="1300" y="590"/><use href="#barrel" x="1240" y="620"/>
  <!-- street lamp -->
  <rect x="1180" y="330" width="8" height="180" fill="#2a2a30"/><circle cx="1184" cy="326" r="10" fill="#e8d890"/><circle cx="1184" cy="326" r="26" fill="#e8d890" opacity=".18"/>
  <!-- zombie horde ring -->
  <g>
    <use href="#zombie" x="560" y="500"/><use href="#zombie" x="640" y="480"/><use href="#zombie" x="760" y="485"/><use href="#zombie" x="840" y="505"/>
    <use href="#zombie" x="520" y="560"/><use href="#zombie" x="880" y="560"/><use href="#zombie" x="600" y="620"/><use href="#zombie" x="700" y="640"/><use href="#zombie" x="800" y="625"/>
    <use href="#zombie" x="460" y="520"/><use href="#zombie" x="940" y="520"/><use href="#zombie" x="420" y="590"/><use href="#zombie" x="980" y="590"/>
    <use href="#zombie" x="380" y="540"/><use href="#zombie" x="1020" y="545"/><use href="#zombie" x="540" y="440"/><use href="#zombie" x="860" y="445"/>
    <use href="#zombie" x="330" y="610"/><use href="#zombie" x="1070" y="615"/><use href="#zombie" x="480" y="660"/><use href="#zombie" x="920" y="660"/>
    <use href="#zombie" x="300" y="540"/><use href="#zombie" x="1100" y="540"/><use href="#zombie" x="620" y="420"/><use href="#zombie" x="780" y="418"/>
    <use href="#zombie" x="260" y="600"/><use href="#zombie" x="1140" y="605"/><use href="#zombie" x="400" y="470"/><use href="#zombie" x="1000" y="475"/>
    <use href="#zombie" x="580" y="540"/><use href="#zombie" x="820" y="545"/><use href="#zombie" x="660" y="585"/><use href="#zombie" x="740" y="580"/>
  </g>
  <!-- hero: blocky survivor, shotgun aimed right, muzzle flash -->
  <g transform="translate(700 540)">
    <rect x="-16" y="-26" width="32" height="40" rx="4" fill="#3a4a5e" stroke="#1c2634" stroke-width="3"/>
    <rect x="-12" y="-46" width="24" height="22" rx="4" fill="#c8a078" stroke="#7a5a3a" stroke-width="3"/>
    <rect x="-12" y="-46" width="24" height="8" fill="#4a3a28"/>
    <rect x="10" y="-14" width="46" height="8" rx="2" fill="#2a2a30" stroke="#141418" stroke-width="2"/>
    <rect x="30" y="-10" width="10" height="12" fill="#4a3418"/>
    <rect x="-14" y="14" width="12" height="18" fill="#26303e"/><rect x="4" y="14" width="12" height="18" fill="#26303e"/>
  </g>
  <circle cx="772" cy="530" r="34" fill="url(#flash)"/>
  <path d="M760 528 L806 522 L762 540 Z" fill="#fff3b0"/>
  <path d="M770 516 L790 530 L768 546" stroke="#ffb020" stroke-width="4" fill="none"/>
  <!-- vignette -->
  <rect width="1408" height="704" fill="none" stroke="#000" stroke-width="40" opacity=".35"/>
</svg>
