<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 1408" width="704" height="1408">
  <!-- Cluck Horizon key art — hand-authored SVG (maga-docs r10). Original-IP
       shmup: heroic chicken pilot in egg-shaped fighter, pastel sky, corn-kernel
       bullets, fox interceptors, zeppelin hen-house boss. -->
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd8e8"/><stop offset="55%" stop-color="#b8e0f8"/><stop offset="100%" stop-color="#e8f8d8"/>
    </linearGradient>
    <g id="corn"><ellipse rx="7" ry="11" fill="#ffd840" stroke="#d8a820" stroke-width="2"/><path d="M-3 -6 h6 M-4 0 h8 M-3 6 h6" stroke="#d8a820" stroke-width="1.5"/></g>
    <g id="fox">
      <path d="M0 -18 L20 10 L8 6 L0 16 L-8 6 L-20 10 Z" fill="#e07830" stroke="#a85020" stroke-width="2.5"/>
      <path d="M-12 -12 L-18 -22 L-6 -16 Z M12 -12 L18 -22 L6 -16 Z" fill="#e07830" stroke="#a85020" stroke-width="2"/>
      <circle cx="-4" cy="-4" r="2" fill="#222"/><circle cx="4" cy="-4" r="2" fill="#222"/>
      <path d="M-3 4 q3 3 6 0" stroke="#7a3818" stroke-width="1.5" fill="none"/>
    </g>
    <g id="cloud"><ellipse rx="60" ry="24" fill="#fff" opacity=".8"/><ellipse cx="40" cy="8" rx="44" ry="18" fill="#fff" opacity=".8"/><ellipse cx="-42" cy="10" rx="40" ry="16" fill="#fff" opacity=".8"/></g>
  </defs>
  <rect width="704" height="1408" fill="url(#csky)"/>
  <use href="#cloud" x="140" y="200"/><use href="#cloud" x="560" y="340"/><use href="#cloud" x="200" y="700"/><use href="#cloud" x="540" y="900"/><use href="#cloud" x="120" y="1150"/>
  <!-- zeppelin hen-house boss -->
  <g transform="translate(352 220)">
    <ellipse rx="200" ry="90" fill="#e8a0b8" stroke="#b86888" stroke-width="5"/>
    <path d="M-200 0 Q0 -110 200 0" fill="#f0b8c8" opacity=".6"/>
    <rect x="-60" y="60" width="120" height="60" rx="10" fill="#c87898" stroke="#b86888" stroke-width="4"/>
    <rect x="-40" y="76" width="24" height="24" fill="#ffe8a0"/><rect x="16" y="76" width="24" height="24" fill="#ffe8a0"/>
    <path d="M-150 -60 l-40 -30 M150 -60 l40 -30" stroke="#b86888" stroke-width="6"/>
    <circle cx="-190" cy="-90" r="14" fill="#e04030"/><circle cx="190" cy="-90" r="14" fill="#e04030"/>
    <text y="10" font-family="sans-serif" font-size="34" font-weight="bold" fill="#7a3850" text-anchor="middle">HEN-ZEPPELIN</text>
  </g>
  <!-- fox interceptors -->
  <use href="#fox" x="160" y="480"/><use href="#fox" x="544" y="470"/><use href="#fox" x="352" y="540"/><use href="#fox" x="240" y="620"/><use href="#fox" x="470" y="640"/>
  <!-- corn-kernel bullets -->
  <use href="#corn" x="280" y="760"/><use href="#corn" x="400" y="820"/><use href="#corn" x="330" y="900"/><use href="#corn" x="450" y="960"/><use href="#corn" x="250" y="1020"/>
  <!-- player shots (feather darts) -->
  <g stroke="#40c8a0" stroke-width="5" stroke-linecap="round">
    <path d="M352 1150 v-60"/><path d="M352 1040 v-60"/><path d="M352 930 v-60"/>
  </g>
  <!-- egg-shaped fighter with chicken pilot -->
  <g transform="translate(352 1240)">
    <ellipse rx="46" ry="58" fill="#f8f0e0" stroke="#b0987a" stroke-width="4"/>
    <ellipse rx="46" ry="58" fill="none" stroke="#e0d0b8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cy="-16" r="20" fill="#aee0f8" stroke="#6a9ab8" stroke-width="3"/>
    <!-- pilot face -->
    <circle cy="-16" r="13" fill="#f8e0c0"/>
    <path d="M-8 -30 q8 -10 16 0" fill="#e04030"/>
    <circle cx="-4" cy="-18" r="2" fill="#222"/><circle cx="5" cy="-18" r="2" fill="#222"/>
    <path d="M8 -12 l8 3 -8 3 z" fill="#f0a020"/>
    <!-- wings + thruster -->
    <path d="M-46 10 q-30 10 -24 40 q16 -8 30 -4" fill="#f8f0e0" stroke="#b0987a" stroke-width="3"/>
    <path d="M46 10 q30 10 24 40 q-16 -8 -30 -4" fill="#f8f0e0" stroke="#b0987a" stroke-width="3"/>
    <path d="M-10 58 q0 22 10 30 q10 -8 10 -30" fill="#ffb020"/>
  </g>
  <g font-family="monospace" font-size="22" fill="#7a5898" opacity=".85">
    <text x="24" y="40">CLUCK HORIZON</text><text x="560" y="40">SEC 2</text>
  </g>
</svg>
