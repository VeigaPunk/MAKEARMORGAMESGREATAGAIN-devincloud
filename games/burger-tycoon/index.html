  }
  var hudSpans = [];
  function setHud(i, text, col = "#eee") {
    while (hudSpans.length <= i) {
      const span = document.createElement("span");
      hudEl.insertBefore(span, speedBtns[0] ?? null);
      hudSpans.push(span);
    }
    hudSpans[i].innerHTML = `<b style="color:${col}">${text}</b>`;
  }
  var last = performance.now();
  function frame(now) {
    const dtReal = Math.min(0.25, (now - last) / 1e3);
    last = now;
    pollInput();
    input.endFrame();
    if (bootChoice !== "" && !paused) {
      sim.tick(dtReal * speed / QUARTER_SECONDS);
    }
    const s = sim.s;
    const bl = totalBacklash(s);
    if (bl >= 45 && prevBacklashTotal < 45) switchMusic(1);
    if (bl < 28 && prevBacklashTotal >= 28) switchMusic(0);
    prevBacklashTotal = bl;
    if (s.over && prevOver !== s.over) {
      if (s.over === "sustained") sfx.preset("cash");
      else {
        sfx.preset("scandal");
        stingFail();
      }
    }
    prevOver = s.over;
    if (s.quarter > bestQuarter && !s.over) {
      bestQuarter = s.quarter - 1;
      save(GAME, "best-quarter", bestQuarter);
    }
    draw();
    requestAnimationFrame(frame);
  }
  var prevProfitGood = { v: false };
  sim.onQuarter = () => {
    const s = sim.s;
    if (s.over) {
      save(GAME, "run", null);
      if (s.quarter - 1 > bestQuarter) {
        bestQuarter = s.quarter - 1;
        save(GAME, "best-quarter", bestQuarter);
      }
      if (s.over === "sustained") {
        sustainedCount++;
        save(GAME, "sustained-count", sustainedCount);
      }
      return;
    }
    save(GAME, "run", { v: 2, s: sim.s, events: sim.events });
    const good = s.lastProfit >= targetNow(s);
    if (good && !prevProfitGood.v) sfx.preset("cash");
    prevProfitGood.v = good;
  };
  layout();
  requestAnimationFrame(frame);
  if (new URLSearchParams(location.search).has("debug")) {
    const w = window;
    w.__maga = {
      get quarter() {
        return sim.s.quarter;
      },
      get cash() {
        return Math.round(sim.s.cash);
      },
      get profit() {
        return Math.round(sim.s.lastProfit);
      },
      get backlash() {
        return sim.summary().backlash;
      },
      get boardPatience() {
        return Math.round(sim.s.patience);
      },
      get panes() {
        return sim.summary().panes;
      },
      get paused() {
        return paused;
      },
      get speed() {
        return speed;
      },
      summary: () => sim.summary(),
      sim,
      setPane,
      input,
      sfx,
      setSpeed: (v) => {
        speed = v;
      },
      setPaused: (v) => {
        paused = v;
      },
      clickAt: (x, y) => {
        for (const h of hits) {
          if (x > h.x && x < h.x + h.w && y > h.y && y < h.y + h.h) {
            h.fn();
            return true;
          }
        }
        return false;
      }
    };
  }
})();

</script>
