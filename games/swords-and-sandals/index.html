    log(`${opponent.name} replies with a theatrical thump for ${damage}.`);
    if (g.hp === 0) {
      log("Defeat! The healer drags you back to the hub.");
      g.hp = g.maxHp;
      mode = "hub";
      persist();
    }
    render();
  }
  function win() {
    if (!opponent) return;
    const reward = 18 + defeated * 8;
    g.gold += reward;
    g.xp += 22;
    level();
    defeated++;
    log(`Victory! Earned ${reward} gold and XP.`);
    g.hp = g.maxHp;
    persist();
    sfx.preset("pickup");
    mode = defeated >= opponents.length ? "complete" : "hub";
    render();
  }
  function draw() {
    const vp = viewport();
    const scale = fitIntegerScale(800, 420, vp);
    const off = letterboxOffset(800, 420, scale, vp);
    void scale;
    void off;
    ctx.clearRect(0, 0, 800, 420);
    ctx.fillStyle = "#4a2033";
    ctx.fillRect(0, 0, 800, 60);
    ctx.fillStyle = "#6e2f33";
    ctx.fillRect(0, 60, 800, 55);
    ctx.fillStyle = "#a8542f";
    ctx.fillRect(0, 115, 800, 45);
    ctx.fillStyle = "#d98e4a";
    ctx.fillRect(0, 160, 800, 30);
    ctx.fillStyle = "#ffcf6e";
    ctx.beginPath();
    ctx.arc(660, 150, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffe3a1";
    ctx.beginPath();
    ctx.arc(660, 150, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6e4a2f";
    ctx.fillRect(0, 92, 800, 86);
    ctx.fillStyle = "#8a5f38";
    ctx.fillRect(0, 92, 800, 6);
    for (let x = 16; x < 800; x += 64) {
      ctx.fillStyle = "#2a1420";
      ctx.fillRect(x, 118, 32, 60);
      ctx.beginPath();
      ctx.arc(x + 16, 118, 16, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#9c6c40";
      ctx.fillRect(x - 4, 112, 4, 66);
      ctx.fillRect(x + 32, 112, 4, 66);
    }
    ctx.fillStyle = "#54371f";
    ctx.fillRect(0, 178, 800, 12);
    for (let row = 0; row < 2; row++) {
      const y = 196 + row * 16;
      for (let i = 0; i < 50; i++) {
        const x = 8 + i * 16 + row % 2 * 8;
        ctx.fillStyle = (i * 7 + row * 3) % 9 === 0 ? "#e8a34e" : "#2a1622";
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(x - 5, y, 10, 7);
      }
    }
    ctx.fillStyle = "#54371f";
    ctx.fillRect(0, 222, 800, 14);
    ctx.fillStyle = "#d9a45f";
    ctx.fillRect(0, 236, 800, 184);
    ctx.fillStyle = "#c68d48";
    ctx.fillRect(0, 236, 800, 10);
    ctx.fillRect(0, 290, 800, 8);
    ctx.fillRect(0, 350, 800, 12);
    for (let i = 0; i < 90; i++) {
      const x = (i * 89 + 37) % 800;
      const y = 248 + i * 53 % 165;
      ctx.fillStyle = i % 3 ? "#b57a3c" : "#e8bd7d";
      ctx.fillRect(x, y, 3, 2);
    }
    ctx.font = "bold 34px monospace";
    ctx.fillStyle = "#3a1420";
    ctx.fillText("SWORDS & SANDALS", 26, 52);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("SWORDS & SANDALS", 24, 50);
    ctx.font = "14px monospace";
    ctx.fillStyle = "#f3d9c0";
    ctx.fillText("native replica", 26, 72);
    if (mode === "arena") {
      ctx.font = "bold 16px monospace";
      ctx.fillStyle = "#3a1420";
      ctx.fillText("ARENA OF BONKS", 27, 93);
      ctx.fillStyle = "#ffb3b3";
      ctx.fillText("ARENA OF BONKS", 26, 92);
    }
    const lookColor = g.look === "Azure" ? "#3f8ce0" : g.look === "Gold" ? "#e6b83c" : "#d43a3a";
    ctx.fillStyle = "#a8763c";
    ctx.beginPath();
    ctx.ellipse(230, 286, 64, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(570, 286, 64, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lookColor;
    ctx.beginPath();
    ctx.arc(230, 220, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#60a5fa";
    ctx.beginPath();
    ctx.arc(570, 220, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2a1420";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(230, 220, 55, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(570, 220, 55, 0, Math.PI * 2);
    ctx.stroke();
  }
  document.querySelector("#mute").onclick = () => {
    sfx.muted = !sfx.muted;
    document.querySelector("#mute").textContent = sfx.muted ? "SOUND OFF" : "SOUND ON";
  };
  if (location.search.includes("debug")) {
    window.__maga = { get mode() {
      return mode;
    }, get screen() {
      return mode;
    }, get gladiatorStats() {
      return { ...g.stats };
    }, get hp() {
      return g.hp;
    }, get gold() {
      return g.gold;
    }, get xp() {
      return g.xp;
    }, get level() {
      return g.level;
    }, get opponent() {
      return defeated;
    }, get opponentHp() {
      return opponent?.hp ?? 0;
    }, get shop() {
      return items.map((x) => ({ ...x }));
    }, get savePresent() {
      return load("swords-and-sandals", "slot", null) !== null;
    } };
  }
  render();
})();

</script>
</body></html>
