  .hudname { color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }

  .sub { color: var(--ink-dim); font-style: italic; }

  .actions button:disabled { opacity: .4; cursor: not-allowed; }
  .actions button:not(:disabled):active { transform: translateY(1px); }

  .logtitle { color: var(--accent); font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; }
  .logline { color: #cdb684; margin: 2px 0; }
  .logline:last-child { color: #ffedb8; }

  .nameinput:focus { outline: 2px solid var(--accent); }

  .cardname { font-weight: bold; color: var(--edge-hi); }
  .cardsub { font-size: 12px; color: var(--ink-dim); flex: 1; }

        b0: "sandals",
        b1: "boots",

      }[id] ?? dflt;
    };

      helm: artOf(eq.helm, "none"),

      weapon: artOf(eq.weapon, "gladius"),

  function gearFromBout(def) {
    const chests = ["rags", "studs", "cuirass", "plate"];

      helm: helms[Math.min(3, def.armorTier)],
      chest: chests[Math.min(3, def.armorTier)],
      shield: def.armorTier >= 2 ? "scutum" : def.armorTier >= 1 ? "buckler" : "none",
      boots: def.armorTier >= 2 ? "boots" : "sandals",
      weapon: def.weaponArt,
      scale: def.scale
    };
  }
