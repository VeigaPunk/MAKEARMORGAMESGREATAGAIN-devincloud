<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The World's Hardest Game — INTERNAL</title>
<style>
  html,body{margin:0;height:100%;background:#141414;display:flex;align-items:center;justify-content:center;font-family:monospace}
  canvas{background:#141414;max-width:100vw;max-height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="960" height="576"></canvas>
<script src="engine.js"></script>
<script src="manifest.js"></script>
<script>
  // Inject level scripts in manifest order (classic scripts — file:// safe).
  for (const f of globalThis.HARDEST_MANIFEST || []) {
    const s = document.createElement('script');
    s.src = 'levels/' + f;
    s.async = false;
    document.body.appendChild(s);
  }
</script>
<script src="pars.js"></script>
<script src="game.js"></script>
</body>
</html>
