<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sandals of Steel — Reign of the Colossus</title>
<style>
  :root {
    --ink: #f4e6c4;
    --ink-dim: #c9a86a;
    --panel: #2a1c10;
    --panel2: #35240f;
    --edge: #8a5a28;
    --edge-hi: #d8a85a;
    --accent: #ffd23a;
    --danger: #d84a3a;
  }
  html, body { margin: 0; height: 100%; background: #171009; color: var(--ink);
    font: 15px/1.45 Georgia, 'Times New Roman', serif; }
  body { display: flex; justify-content: center; }
  .badge { position: fixed; top: 0; left: 0; right: 0; padding: 4px; background: #35141b; color: #ffb3b3;
    text-align: center; font-size: 11px; z-index: 5; }
  .mute { position: fixed; top: 30px; right: 8px; z-index: 5; background: #29243a; color: #ffd166;
    border: 1px solid #66547d; padding: 8px 10px; border-radius: 6px; font: 13px Georgia; cursor: pointer; }
  .app { width: min(980px, 100%); padding-top: 30px; display: flex; flex-direction: column; gap: 8px; }
  .hud { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: linear-gradient(#3a2817, #2a1c10); border: 2px solid var(--edge); border-radius: 8px;
    font-size: 14px; }
  .hudname { color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }
  .stage-wrap { position: relative; background: #0d0805; border: 3px solid var(--edge); border-radius: 10px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.6), 0 4px 18px rgba(0,0,0,.5); }
  canvas.stage { width: 100%; height: auto; display: block; border-radius: 7px; }
  .chrome { padding: 12px 14px; background: linear-gradient(#2e1f12, #241708);
    border: 2px solid var(--edge); border-radius: 8px; min-height: 60px; }
  .chrome h1 { margin: 0 0 6px; color: var(--accent); font-size: 26px; letter-spacing: 1px; }
  .chrome h2 { margin: 0; color: var(--edge-hi); font-size: 16px; letter-spacing: 3px; }
  .chrome h3 { margin: 0 0 6px; color: var(--edge-hi); }
  .chrome p { margin: 6px 0; }
  .sub { color: var(--ink-dim); font-style: italic; }
  .titlewrap { text-align: center; padding: 8px 0 4px; }
  .titlewrap h1 { font-size: 34px; }
  .saveinfo { color: var(--ink-dim); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px;
    background: #241708; border: 2px solid var(--edge); border-radius: 8px; position: sticky; bottom: 0; z-index: 2; }
  .actions button, .overlaybox button {
    min-height: 52px; min-width: 108px; flex: 1 1 auto; padding: 6px 10px; cursor: pointer;
    background: linear-gradient(#b3813f, #8a5a28 45%, #6e4520 55%, #54340f);
    color: #ffe9b8; border: 2px solid var(--edge-hi); border-radius: 8px;
    font: bold 14px Georgia; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    text-shadow: 0 1px 0 rgba(0,0,0,.5); touch-action: manipulation;
  }
  .actions button small { font-weight: normal; font-size: 11px; color: #e8d0a0; }
  .actions button:disabled { opacity: .4; cursor: not-allowed; }
  .actions button:not(:disabled):active { transform: translateY(1px); }
  .log { max-height: 190px; overflow-y: auto; padding: 8px 12px; background: #140c06;
    border: 2px solid #4a3115; border-radius: 8px; font-size: 13.5px; }
  .log:empty { display: none; }
  .logtitle { color: var(--accent); font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; }
  .logline { color: #cdb684; margin: 2px 0; }
  .logline:last-child { color: #ffedb8; }
  .overlay { position: fixed; inset: 0; background: rgba(10, 6, 2, .78); display: none;
    align-items: center; justify-content: center; z-index: 20; }
  .overlay.show { display: flex; }
  .overlaybox { width: min(440px, 92vw); background: linear-gradient(#3a2817, #241708);
    border: 3px solid var(--edge-hi); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .overlaybox h3 { margin: 0; color: var(--accent); }
  .overlaybox .wide { width: 100%; }
  .danger { background: linear-gradient(#a03428, #7a1f16) !important; }
  /* creation */
  .createwrap .namerow { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
  .nameinput { flex: 1; max-width: 320px; font: bold 18px Georgia; padding: 10px 12px; color: #3a1c08;
    background: #f0dca8; border: 2px solid #8a6238; border-radius: 8px; }
  .nameinput:focus { outline: 2px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .lookbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; cursor: pointer;
    background: #241708; border: 2px solid var(--edge); border-radius: 8px; color: var(--ink); font: 14px Georgia; }
  .lookbtn.sel { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,210,58,.35); }
  .lookbtn img { width: 64px; height: 74px; }
  .dials { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; margin: 10px 0; }
  .dialrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .diallabel { width: 68px; color: var(--edge-hi); font-size: 14px; }
  .dial { flex: 1; accent-color: var(--edge-hi); min-height: 28px; }
  .dialends { flex: 1; display: flex; align-items: center; gap: 8px; }
  .dialends small { width: 90px; color: var(--ink-dim); font-size: 11px; text-align: right; }
  .dialends small:last-child { text-align: left; }
  .derived { color: var(--ink-dim); font-size: 13px; }
  .statbox { border-top: 1px solid #4a3115; padding-top: 8px; }
  .staterow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .statlabel { font-size: 14px; }
  .statlabel b { color: var(--edge-hi); }
  .stattrl { display: flex; align-items: center; gap: 10px; }
  .statnum { width: 26px; text-align: center; font-size: 18px; color: var(--accent); font-weight: bold; }
  .statbtn { width: 44px; height: 40px; font: bold 20px Georgia; cursor: pointer; color: #ffe9b8;
    background: linear-gradient(#b3813f, #6e4520); border: 2px solid var(--edge-hi); border-radius: 8px; }
  .statbtn:disabled { opacity: .35; cursor: not-allowed; }
  /* hub */
  .hubwrap { display: flex; gap: 18px; flex-wrap: wrap; }
  .hubleft { flex: 1.2; min-width: 300px; }
  .kit { color: var(--ink-dim); font-size: 14px; }
  .trainbox { margin-top: 10px; padding: 10px; background: rgba(255,210,58,.07);
    border: 1px dashed var(--edge-hi); border-radius: 8px; }
  .healbox { margin-top: 10px; color: var(--ink-dim); }
  .oppCard { flex: 1; min-width: 300px; background: linear-gradient(#e8d0a0, #d8bd85); color: #3a2410;
    border: 3px solid #8a6238; border-radius: 4px; padding: 10px 14px;
    box-shadow: 2px 3px 0 rgba(0,0,0,.4); position: relative; }
  .oppCard::before { content: "NEXT BOUT"; position: absolute; top: -10px; left: 12px; background: #8a2a22;
    color: #ffe9b8; font-size: 11px; letter-spacing: 2px; padding: 2px 8px; border-radius: 3px; }
  .opphead { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .oppport { width: 56px; height: 65px; border: 2px solid #8a6238; border-radius: 4px; background: #f4e6c4; }
  .oppname { font-weight: bold; font-size: 19px; letter-spacing: 0.5px; }
  .oppstats { font-size: 12.5px; color: #5a4020; }
  .taunt { font-style: italic; margin: 8px 0 4px; }
  .purse { font-size: 13px; color: #6a4a1c; }
  .career { font-size: 12px; color: #7a5c30; border-top: 1px solid rgba(90,58,24,.3); padding-top: 6px; margin-top: 8px; }
  /* combat */
  .combatwrap .combatbars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
  .fightbar, .minibar { display: flex; align-items: center; gap: 8px; }
  .barname { width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--edge-hi); }
  .bartrack { flex: 1; height: 14px; background: #140c06; border: 1px solid #4a3115; border-radius: 4px; overflow: hidden; }
  .minibar .bartrack { height: 9px; }
  .barfill { height: 100%; transition: width .35s ease; background: var(--danger); }
  .barval { width: 70px; font-size: 12px; color: var(--ink-dim); text-align: right; }
  .combatmeta { color: var(--ink-dim); font-size: 13px; margin: 6px 0 0; }
  /* shops */
  .shopinfo { color: var(--ink-dim); }
  .disc { color: var(--accent); }
  .shopmsg { font-weight: bold; }
  .shopmsg.ok { color: #7dff8a; }
  .shopmsg.no { color: #ff8a7a; }
  .shopgrid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); margin-top: 10px; }
  .shopcard { display: flex; flex-direction: column; gap: 4px; padding: 10px;
    background: #1e1207; border: 2px solid var(--edge); border-radius: 8px; }
  .shopcard.active { border-color: var(--accent); }
  .cardname { font-weight: bold; color: var(--edge-hi); }
  .cardsub { font-size: 12px; color: var(--ink-dim); flex: 1; }
  .buybtn { min-height: 44px; cursor: pointer; font: bold 13px Georgia; color: #ffe9b8;
    background: linear-gradient(#b3813f, #6e4520); border: 2px solid var(--edge-hi); border-radius: 8px; }
  .buybtn:disabled { opacity: .4; cursor: not-allowed; }
  .stockinfo { color: var(--ink-dim); margin-top: 8px; }
  /* end */
  .endwrap { text-align: center; padding: 10px 0; }
  .endwrap h1 { font-size: 40px; }
  .endsum { max-width: 640px; margin: 10px auto; color: var(--ink); }
  @media (max-width: 640px) {
    .app { padding-top: 26px; }
    .actions button { min-width: 46%; font-size: 12px; }
    .dials { grid-template-columns: 1fr; }
    .combatwrap .combatbars { grid-template-columns: 1fr; }
    .hud { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="badge">INTERNAL-NO-PUBLIC — idea 001 native replica · no ship until written clearance (eGames.com LLC + Whiskeybarble Studios)</div>
<button id="mute" class="mute" type="button">SOUND ON</button>
<main class="app">
  <div id="hud" class="hud"></div>
  <div class="stage-wrap"><canvas id="stage" class="stage" width="960" height="560"></canvas></div>
  <section id="chrome" class="chrome"></section>
  <div id="actions" class="actions"></div>
  <div id="log" class="log"></div>
</main>
<div id="overlay" class="overlay"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
