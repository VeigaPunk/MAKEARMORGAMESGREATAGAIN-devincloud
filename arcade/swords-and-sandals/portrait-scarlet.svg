      <stop offset="0" stop-color="#cfd3dc"/><stop offset="1" stop-color="#7d8290"/>
    </linearGradient>
  </defs>
  <rect width="96" height="112" fill="#2a1420"/>
  <rect y="88" width="96" height="24" fill="#c98d4e"/>
  <!-- body -->
  <path d="M30 92 Q30 66 48 64 Q66 66 66 92 Z" fill="#8c3b3b"/>
  <path d="M34 92 Q34 70 48 68 Q62 70 62 92 Z" fill="#a34a44"/>
