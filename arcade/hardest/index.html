<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11151c">
<meta name="description" content="114 handcrafted precision challenges. Collect every coin, learn the blue patrols, and make it to green.">
<title>The World's Hardest Game</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11151c;color:#edf2f7;font-family:system-ui,sans-serif}body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px}main{width:min(960px,100%)}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:.13em;font-weight:800;margin-right:auto;color:#c7d4e7}.brand span{color:#79d99b}button{font:600 12px system-ui;background:#202a38;color:#e7eef9;border:1px solid #3a485b;border-radius:7px;padding:10px 13px;cursor:pointer;min-height:40px}button:hover{background:#2c3b51}button:focus-visible,canvas:focus-visible{outline:3px solid #ffc957;outline-offset:3px}button:disabled{opacity:.4;cursor:default}canvas{display:block;background:#11151c;width:100%;height:auto;max-width:calc((100svh - 135px) * 1.666667);margin-inline:auto;touch-action:none;border:1px solid #354154;border-radius:12px;box-shadow:0 20px 60px #0006}.picker{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px;font-size:12px;color:#afbed3}.picker[hidden]{display:none}.picker select{max-width:350px;min-width:0;flex:1;background:#202a38;color:#edf2f7;border:1px solid #3a485b;border-radius:7px;padding:10px;min-height:42px;font:13px system-ui}.picker button{background:#2b7047;border-color:#52ad75;min-height:42px}.picker select:focus-visible{outline:3px solid #ffc957;outline-offset:3px}main[data-screen=menu] canvas{max-width:calc((100svh - 195px) * 1.666667)}.help{font-size:12px;line-height:1.6;color:#9cacc2;text-align:center;margin:12px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){body{padding:8px}.brand{width:100%;margin-bottom:3px}.toolbar{gap:6px;margin-bottom:8px}button{padding:9px 11px}.help{font-size:11px}canvas{border-radius:7px}}@media(prefers-reduced-motion:reduce){canvas{scroll-behavior:auto}}
</style>
<link rel="icon" href="../favicon.svg"><script defer src="../return.js"></script></head>
<body>
<main>
<nav class="toolbar" aria-label="Game controls"><span class="brand"><span>114</span> PRECISION CHALLENGES</span><button id="levels" type="button">Levels</button><button id="pause" type="button">Pause</button><button id="restart" type="button">Restart</button><button id="sound" type="button" aria-label="Mute sound" aria-pressed="false">Sound on</button></nav>
<div class="picker" id="picker"><label for="level-choice">Challenge</label><select id="level-choice" aria-label="Choose an unlocked level"></select><button id="play-level" type="button">Play</button></div>
<canvas id="c" width="960" height="576" tabindex="0" aria-label="The World's Hardest Game. Use arrow keys to choose a level and Enter to start. Move with arrow keys or WASD; collect all yellow coins and reach the green goal." aria-describedby="help">This game needs a browser with Canvas support.</canvas>
<p class="help" id="help">Move: arrows / WASD / drag · Collect every coin, then reach green · R restart · Esc pause · M sound</p>
<p class="sr-only" id="status" role="status" aria-live="polite">Loading levels.</p>
</main>
<script src="engine.js"></script>
<script src="save.js"></script>
<script src="manifest.js"></script>
<script>
  for (const f of globalThis.HARDEST_MANIFEST || []) {
    const s = document.createElement('script');
    s.src = 'levels/' + f;
    s.async = false;
    s.onerror = () => { document.getElementById('status').textContent = 'A level could not load. Reload to retry.'; document.getElementById('help').textContent = 'A level could not load. Reload the page to retry.'; };
    document.body.appendChild(s);
  }
</script>
<script src="pars.js"></script>
<script src="game.js"></script>
</body>
</html>
