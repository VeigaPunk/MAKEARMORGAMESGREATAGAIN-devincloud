<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 52" width="56" height="52">
  <!-- FLOCKBIRD BRUISER — heavy bruiser: bulky armored body, pauldrons, brow ridge. -->
  <g stroke-linejoin="round">
    <!-- stub wings -->
    <polygon points="10,26 2,34 14,36" fill="#e8590c" stroke="#3a1c05" stroke-width="1.5"/>
    <polygon points="46,26 54,34 42,36" fill="#e8590c" stroke="#3a1c05" stroke-width="1.5"/>
    <!-- bulky body -->
    <ellipse cx="28" cy="30" rx="17" ry="15" fill="#ffe677" stroke="#3a1c05" stroke-width="2"/>
    <!-- armor plates -->
    <path d="M15,24 Q 28,16 41,24" stroke="#e8590c" stroke-width="2.4" fill="none"/>
    <path d="M13,31 Q 28,23 43,31" stroke="#e8590c" stroke-width="2.4" fill="none"/>
    <!-- small head sunk into shoulders -->
    <circle cx="28" cy="14" r="7" fill="#ffc92a" stroke="#3a1c05" stroke-width="1.8"/>
    <!-- heavy brow -->
    <path d="M22,11 L 28,9 L 34,11" stroke="#3a1c05" stroke-width="2.2" fill="none"/>
    <!-- thick beak -->
    <polygon points="24,15 32,15 28,5" fill="#e8590c" stroke="#3a1c05" stroke-width="1.4"/>
    <!-- beady eyes under brow -->
    <circle cx="24.5" cy="13" r="1.5" fill="#111"/>
    <circle cx="31.5" cy="13" r="1.5" fill="#111"/>
    <!-- rivets -->
    <circle cx="20" cy="36" r="1.4" fill="#3a1c05"/>
    <circle cx="28" cy="38" r="1.4" fill="#3a1c05"/>
    <circle cx="36" cy="36" r="1.4" fill="#3a1c05"/>
  </g>
</svg>
